<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div id="app">
        <!-- Header -->
        <header class="bg-gray-800 border-b border-gray-700">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between items-center h-16">
                    <div class="flex items-center">
                        <h1 class="text-2xl font-bold text-blue-400">IPTV Streaming</h1>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <input 
                                type="text" 
                                id="searchInput"
                                placeholder="Search channels..." 
                                class="bg-gray-700 text-white px-4 py-2 rounded-lg w-64 focus:outline-none focus:ring-2 focus:ring-blue-500"
                            >
                        </div>
                        <button id="settingsBtn" class="p-2 text-gray-400 hover:text-white">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex h-screen">
            <!-- Sidebar -->
            <aside class="w-80 bg-gray-800 border-r border-gray-700 overflow-y-auto">
                <div class="p-4">
                    <h2 class="text-lg font-semibold mb-4">Categories</h2>
                    <div id="categoryList" class="space-y-2">
                        <!-- Categories will be populated by JavaScript -->
                    </div>
                </div>
                
                <div class="p-4 border-t border-gray-700">
                    <h2 class="text-lg font-semibold mb-4">Channels</h2>
                    <div id="channelList" class="space-y-2">
                        <!-- Channels will be populated by JavaScript -->
                    </div>
                </div>
            </aside>

            <!-- Video Player Area -->
            <main class="flex-1 bg-gray-900">
                <div class="h-full flex flex-col">
                    <!-- Video Container -->
                    <div class="flex-1 bg-black flex items-center justify-center">
                        <div id="videoContainer" class="w-full h-full">
                            <video 
                                id="videoPlayer" 
                                class="w-full h-full object-contain"
                                controls
                                crossorigin="anonymous"
                                style="display: none;"
                            >
                                Your browser does not support the video tag.
                            </video>
                            
                            <!-- Welcome Screen -->
                            <div id="welcomeScreen" class="flex items-center justify-center h-full bg-gradient-to-br from-gray-800 to-gray-900">
                                <div class="text-center">
                                    <div class="mb-6">
                                        <svg class="w-24 h-24 mx-auto text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h1m4 0h1m-6 4h8m2 4H5a2 2 0 01-2-2V7a2 2 0 012-2h14a2 2 0 012 2v9a2 2 0 01-2 2z"></path>
                                        </svg>
                                    </div>
                                    <h3 class="text-2xl font-semibold mb-2">Welcome to IPTV Streaming</h3>
                                    <p class="text-gray-400">Select a channel from the sidebar to start watching</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Now Playing Info -->
                    <div id="nowPlaying" class="bg-gray-800 p-4 border-t border-gray-700" style="display: none;">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 id="currentChannelName" class="text-lg font-semibold">-</h3>
                                <p id="currentChannelCategory" class="text-gray-400 text-sm">-</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button id="fullscreenBtn" class="p-2 text-gray-400 hover:text-white">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                                    </svg>
                                </button>
                                <div class="flex items-center space-x-2">
                                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 14.142M6.343 6.343a9 9 0 000 12.728m2.121-2.121a5 5 0 000-7.072"></path>
                                    </svg>
                                    <input 
                                        type="range" 
                                        id="volumeSlider" 
                                        min="0" 
                                        max="100" 
                                        value="70" 
                                        class="w-20 h-2 bg-gray-600 rounded-lg appearance-none cursor-pointer slider"
                                    >
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50" style="display: none;">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-400 mx-auto mb-4"></div>
                <p class="text-white">Loading stream...</p>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="settingsModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="display: none;">
            <div class="bg-gray-800 rounded-lg p-6 w-96 max-w-md mx-4">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-semibold">Settings</h3>
                    <button id="closeSettings" class="text-gray-400 hover:text-white">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-2">M3U Playlist URL</label>
                        <input 
                            type="url" 
                            id="playlistUrl" 
                            placeholder="https://example.com/playlist.m3u"
                            class="w-full bg-gray-700 text-white px-3 py-2 rounded border border-gray-600 focus:outline-none focus:border-blue-500"
                        >
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium mb-2">Auto-play</label>
                        <label class="flex items-center">
                            <input type="checkbox" id="autoplayToggle" class="mr-2">
                            <span class="text-sm">Enable auto-play for channels</span>
                        </label>
                    </div>
                    
                    <div class="flex justify-end space-x-2 pt-4">
                        <button id="cancelSettings" class="px-4 py-2 text-gray-400 hover:text-white">Cancel</button>
                        <button id="saveSettings" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
